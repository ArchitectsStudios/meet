name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  images:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, bot]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/meet-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/meet-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Turn on by setting the repository variable DEPLOY_ENABLED=true and the secrets
  # VPS_HOST, VPS_USER and VPS_SSH_KEY. The VPS user needs kubectl access to the cluster.
  deploy:
    needs: images
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            kubectl -n meet set image deploy/web web=ghcr.io/${{ github.repository_owner }}/meet-web:${{ github.sha }}
            kubectl -n meet set image deploy/bot bot=ghcr.io/${{ github.repository_owner }}/meet-bot:${{ github.sha }}
            kubectl -n meet rollout status deploy/web --timeout=180s
            kubectl -n meet rollout status deploy/bot --timeout=180s
