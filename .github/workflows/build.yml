name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # Bungie-style build string, {seq}.{yy}.{mm}.{dd}.{hhmm}.{branch}; seq is the run number.
  # See scripts/compute-build-string.mjs.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_string: ${{ steps.compute.outputs.build_string }}
      image_owner: ${{ steps.compute.outputs.image_owner }}
      branch: ${{ steps.compute.outputs.branch }}
      commit: ${{ steps.compute.outputs.commit }}
      built_at: ${{ steps.compute.outputs.built_at }}
    steps:
      - uses: actions/checkout@v5
      # The runner's own Node is enough. setup-node v5 would turn on pnpm caching here and fail.
      - name: Compute build string
        id: compute
        env:
          MEET_BRANCH: ${{ github.head_ref || github.ref_name }}
          MEET_SEQ: ${{ github.run_number }}
        run: |
          INFO=$(node scripts/compute-build-string.mjs)
          field() { node -e "process.stdout.write(String(JSON.parse(process.argv[1])[process.argv[2]]))" "$INFO" "$1"; }
          echo "build_string=$(field buildString)" >> "$GITHUB_OUTPUT"
          # GHCR image names must be lowercase; the owner is "ArchitectsStudios".
          echo "image_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "branch=$(field branch)" >> "$GITHUB_OUTPUT"
          echo "commit=$(field commit)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(field builtAt)" >> "$GITHUB_OUTPUT"
          echo "Build $(field buildString)"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  images:
    needs: [prepare, check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, bot]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.image_owner }}/meet-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ needs.prepare.outputs.image_owner }}/meet-${{ matrix.app }}:latest
          build-args: |
            MEET_BUILD_STRING=${{ needs.prepare.outputs.build_string }}
            MEET_BUILD_BRANCH=${{ needs.prepare.outputs.branch }}
            MEET_BUILD_COMMIT=${{ needs.prepare.outputs.commit }}
            MEET_BUILD_TIME=${{ needs.prepare.outputs.built_at }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Tags the commit with its build string, as Datamine Explorer does.
  tag:
    needs: [prepare, images]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create build tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.build_string }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$TAG" || "$TAG" == "untracked version" ]]; then
            echo "Refusing to tag untracked build"
            exit 1
          fi
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi
          TAG_SHA=$(gh api "repos/${REPO}/git/tags" -f tag="$TAG" -f message="Build $TAG" -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$TAG_SHA" >/dev/null
          echo "Tagged $SHA as $TAG"

  # Turn on by setting the repository variable DEPLOY_ENABLED=true and the secrets
  # VPS_HOST, VPS_USER and VPS_SSH_KEY. The VPS user needs kubectl access to the cluster.
  deploy:
    needs: [prepare, images]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            kubectl -n meet set image deploy/web web=ghcr.io/${{ needs.prepare.outputs.image_owner }}/meet-web:${{ github.sha }}
            kubectl -n meet set image deploy/bot bot=ghcr.io/${{ needs.prepare.outputs.image_owner }}/meet-bot:${{ github.sha }}
            kubectl -n meet rollout status deploy/web --timeout=180s
            kubectl -n meet rollout status deploy/bot --timeout=180s
