apiVersion: v1
kind: Service
metadata:
  name: bot
  labels: { app: bot }
spec:
  type: ClusterIP # internal only; never exposed through the Ingress
  selector: { app: bot }
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
spec:
  replicas: 1 # one Discord gateway session; never scale above 1
  strategy:
    type: Recreate # stop the old pod before the new one logs in
  selector:
    matchLabels: { app: bot }
  template:
    metadata:
      labels: { app: bot }
    spec:
      # Without this, Kubernetes injects BOT_PORT=tcp://... for the "bot" Service, which breaks our BOT_PORT setting.
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull # only needed while the GHCR package is private
      containers:
        - name: bot
          image: ghcr.io/architectsstudios/meet-bot:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef: { name: meet-config }
            - secretRef: { name: meet-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000 # the "node" user in node:22-alpine
