# Traefik (bundled with k3s) routes by Host header, so every subdomain shares ports 80 and 443.
# To add another service later, give it its own Ingress with its own host and TLS secret.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # <namespace>-<middleware name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: meet-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [meet.architectsstudios.dev]
      secretName: meet-tls
  rules:
    - host: meet.architectsstudios.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
